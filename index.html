  @media (prefers-color-scheme:dark){:root{--bg:#1d1913;--ink:#eadfc6;--panel:#2a241b;--line:#a98550;--logo:#eadfc6;--z-wait:#e3a43a;--z-done:#9ccb63}}

  h1{margin:0;line-height:0;flex:none}
  h1 .logo-h{height:clamp(34px,5vh,46px)}h1 .logo-s{display:none;height:clamp(34px,11.2vw,48px)}   /* 320 寬：七位數分數＋標題剛好放得下 */
  @media (max-width:640px){h1 .logo-h{display:none}h1 .logo-s{display:block}}   /* 窄螢幕：改用方形標題 */
  .stats{display:flex;gap:6px;flex-wrap:nowrap}
  .chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px}
  .chip svg{width:clamp(16px,2.6vh,22px);height:clamp(16px,2.6vh,22px);flex:none;stroke:var(--line);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .chip .cap{display:flex;flex-direction:column;line-height:1.05}
  @media (max-width:520px){   /* 窄螢幕：數據卡收緊（去掉小圖示），標題才放得下 */
    .chip>svg{display:none}.chip{padding:3px 10px}.stats{gap:4px}
  }
  .chip small{font-size:clamp(9px,1.5vh,11px);opacity:.65;letter-spacing:1px;white-space:nowrap}
  .chip b{font-size:clamp(15px,min(2.8vh,4.4vw),24px);white-space:nowrap;font-variant-numeric:tabular-nums}
  #wrap{position:relative;flex:1;min-height:0}
  canvas{position:absolute;display:block;touch-action:pinch-zoom;border-radius:10px}
  .bar{display:flex;gap:8px;align-items:center}
  @media (max-width:640px) and (min-height:521px){   /* 手機（直式）：下一城獨佔一行；搖一搖放中間、放大，重來在左（兩手都好按） */
    #app>.bar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
    #app>#next{flex:none;align-self:center;min-width:min(100%,240px);justify-content:center;padding-block:4px}   /* 手機：下一城搬到州色條下方，底部只留三顆按鈕 */
    #app>.bar #reset{grid-row:1;grid-column:1;justify-self:start}
    #app>.bar #shake{grid-row:1;grid-column:2}
    #app>.bar #shake{width:clamp(76px,22vw,92px);height:clamp(76px,22vw,92px);border-radius:50%}   /* 手機：搖一搖是一顆大圓鈕，和左右兩顆圓鈕成一排 */
    #app>.bar #shake svg{width:56%;height:56%;transform:translateY(-4%);overflow:visible}
    #app>.bar #achBtn{grid-row:1;grid-column:3;justify-self:end}   /* 成就鈕搬到右下，和左下的重來左右對稱 */
    #app>.bar #reset,#app>.bar #achBtn{width:52px;height:52px;opacity:1}
    #app{padding:6px 4px 10px}   /* 箱子是寬度受限：左右留白縮小，箱子就能放大；標題列與按鈕列自己留邊 */
    #app>header,#app>.bar,#app>.legend.bottom{padding-inline:12px}
    #app>.bar #shake::after{bottom:14px;height:4px}
  }
  .pill{flex:none;font-size:clamp(12px,min(2vh,3.2vw),17px);padding:6px 12px;border-radius:999px;background:var(--line);color:var(--panel);letter-spacing:1px;white-space:nowrap}
  #next{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:clamp(14px,min(2.4vh,3.8vw),21px);font-weight:bold;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap;overflow:hidden}
  #next small{font-weight:normal;opacity:.6;font-size:.72em;letter-spacing:1px}
  #next i{flex:none;width:12px;height:12px;border-radius:50%;background:#aaa;border:1px solid rgba(0,0,0,.25)}
  button{font:inherit;font-size:clamp(12px,min(2.1vh,3.4vw),20px);padding:8px clamp(8px,2.2vw,14px);white-space:nowrap;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  button:active{transform:translateY(1px)}
  .ib{position:relative;flex:none;width:clamp(44px,6.4vh,52px);height:clamp(44px,6.4vh,52px);padding:0;border-radius:50%;display:grid;place-items:center}
  .ib svg{width:54%;height:54%;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ib:disabled{opacity:.4;cursor:not-allowed}
  .ib:hover:not(:disabled){box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .ib.sm{width:44px;height:44px}
  #achBtn{background:#fbe3a1;border-color:#d9a521}   /* 成就鈕：金色，與旁邊的數據卡區隔 */
  #achBtn svg{stroke:#7a4f0e}
  #achBtn:hover:not(:disabled){background:#fdeab6}
  .ib.quiet{width:44px;height:44px;opacity:.75}   /* 觸控目標至少 44px */
  .ib.quiet:hover{opacity:1}
  .badge{position:absolute;top:-5px;right:-5px;min-width:20px;padding:1px 5px;border-radius:999px;background:#d9a521;color:#3a2a18;border:1px solid #fff8dc;font:bold 11px/16px sans-serif;text-align:center}
  :root{--accent:#a8552b}
  .ib.primary{width:clamp(56px,9vh,76px);border-radius:999px;background:var(--accent);border-color:var(--accent);box-shadow:0 3px 10px rgba(168,85,43,.45)}
  .ib.primary svg{stroke:#fff8e8;stroke-width:2.1;width:56%;height:56%}
  .ib.primary:hover:not(:disabled){filter:brightness(1.1);box-shadow:0 4px 14px rgba(168,85,43,.6)}
  .ib.primary:disabled{filter:grayscale(.6)}
  .ib.primary::after{content:"";position:absolute;left:16%;right:16%;bottom:7px;height:3px;border-radius:2px;background:rgba(255,248,232,.85);transform-origin:left;transform:scaleX(var(--cd,0));opacity:0;transition:opacity .2s}
  .ib.primary.cool::after{opacity:1}   /* 冷卻中：底下的小條慢慢填滿，滿了就能再搖 */

function addRing(x,y,t0,r1,color,w){fx.rings.push({x,y,t0,dur:620,r0:6,r1,color,w:w||4});}
function addConfetti(x,y,t0,n,colors,power,up){
  for(let i=0;i<n;i++){
    const a=(up?-Math.PI/2:Math.random()*Math.PI*2)+(Math.random()-.5)*(up?2.4:0),v=(1.4+Math.random()*2.6)*power;
    fx.confetti.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(up?1.5:0),rot:Math.random()*6.28,vr:(Math.random()-.5)*.35,
      c:colors[(Math.random()*colors.length)|0],size:4+Math.random()*5,t0:t0+Math.random()*120,life:1300+Math.random()*700});
  }
}
function shakeScreen(t0,amp,dur){fx.shake={t0,amp,dur};}
function shakeOffset(now){
  const s=fx.shake;if(!s)return {x:0,y:0};
  const u=(now-s.t0)/s.dur;if(u<0)return {x:0,y:0};if(u>=1){fx.shake=null;return {x:0,y:0};}
  const k=(1-u)*(1-u)*s.amp;return {x:Math.sin(now*0.09)*k,y:Math.cos(now*0.113)*k};
}
// 相連時：層級依相連數增強（停頓、光環、交界光點、彩紙、金色閃光、震動）
function mergeBurst(n,cx,cy,pts,T,go){

  const col=zcol(T.pcs[0].s);
  addRing(cx,cy,go,70+tier*34,'#ffffff',4);
  addRing(cx,cy,go+90,50+tier*26,GOLD,3);
  if(tier>=1)addRing(cx,cy,go+170,90+tier*40,col,5);
  // 交界處的光點（沿著新接上的那條邊亮起來）
  for(let i=0;i<pts.length;i+=2)fx.glints.push({x:pts[i].x,y:pts[i].y,t0:go+(i%7)*18,dur:700,r:7+tier*2});
  addConfetti(cx,cy,go,8+tier*10,[GOLD,'#fff6bf','#ffffff',col],1+tier*.35,false);
  if(tier>=2){fx.flashes.push({t0:go,dur:420,color:'255,222,120',alpha:.22+tier*.05});shakeScreen(go,2+tier*1.2,380);}
  if(tier>=4){fx.flashes.push({t0:go+120,dur:900,color:'255,240,180',alpha:.4});}
}
function drawFxBack(now){
  drawWind(now);
  // 光環：由交界處向外擴散
  fx.rings=fx.rings.filter(r=>now-r.t0<r.dur);
  for(const r of fx.rings){
    const u=(now-r.t0)/r.dur;if(u<0)continue;const e=1-Math.pow(1-u,3);
    ctx.globalAlpha=(1-u)*.9;ctx.lineWidth=r.w*(1-u*.6);ctx.strokeStyle=r.color;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r0+(r.r1-r.r0)*e,0,Math.PI*2);ctx.stroke();
  }
  // 交界光點
  fx.glints=fx.glints.filter(g=>now-g.t0<g.dur);
  for(const g of fx.glints){
    const u=(now-g.t0)/g.dur;if(u<0)continue;
    const a=Math.sin(Math.PI*Math.min(1,u*1.15));
    const gr=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,g.r*(1+u));
    gr.addColorStop(0,`rgba(255,250,215,${a})`);gr.addColorStop(.45,`rgba(255,212,90,${a*.7})`);gr.addColorStop(1,'rgba(255,212,90,0)');
    ctx.globalAlpha=1;ctx.fillStyle=gr;ctx.beginPath();ctx.arc(g.x,g.y,g.r*(1+u),0,Math.PI*2);ctx.fill();
  }

const FIRE_FX_MS=2000;
// 一根火舌：由底部往上、寬度逐漸收尖，中線隨時間左右扭動（S 形，越往上擺幅越大），畫成平滑曲線；底色→尖端漸層
function flameShape(x,y,w,h,t,ph,k,c0,c1){
  const n=7,L=[],Rr=[];
  for(let i=0;i<=n;i++){
    const p=i/n,wid=w*Math.pow(1-p,.85)*(1+.25*Math.sin(p*3.1+ph)),sw=Math.sin(t*.012+ph+p*3.4)*w*1.5*p*p+Math.sin(t*.021+ph*1.7)*w*.35*p;
    const cx=x+sw,cy=y-h*p;L.push({x:cx-wid,y:cy});Rr.push({x:cx+wid,y:cy});
  }
  ctx.beginPath();ctx.moveTo(L[0].x,L[0].y);
  for(let i=1;i<=n;i++){const m={x:(L[i-1].x+L[i].x)/2,y:(L[i-1].y+L[i].y)/2};ctx.quadraticCurveTo(L[i-1].x,L[i-1].y,m.x,m.y);}
  ctx.lineTo(L[n].x,L[n].y);
  for(let i=n;i>=1;i--){const m={x:(Rr[i].x+Rr[i-1].x)/2,y:(Rr[i].y+Rr[i-1].y)/2};ctx.quadraticCurveTo(Rr[i].x,Rr[i].y,m.x,m.y);}
  ctx.lineTo(Rr[0].x,Rr[0].y);ctx.closePath();
  const g=ctx.createLinearGradient(0,y,0,y-h);g.addColorStop(0,c0);g.addColorStop(.7,c1);g.addColorStop(1,'rgba(255,200,80,0)');
  ctx.fillStyle=g;ctx.fill();
}
function drawFires(now){
  if(!fx.fires||!fx.fires.length)return;
  fx.fires=fx.fires.filter(f=>now-f.t0<f.dur);
  const reduce=RM.matches;
  for(const f of fx.fires){
    const u=(now-f.t0)/f.dur;if(u<0)continue;
    const R=Math.max(f.R,46),c=f.c;   // 小城的火也要夠大才吸睛
    ctx.save();
    // 地面光暈：橘色的火光照在附近
    {const g=ctx.createRadialGradient(c.x,c.y,R*.1,c.x,c.y,R*2.1);const a=(u<.15?u/.15:1-(u-.15)/.85)*.55;g.addColorStop(0,'rgba(255,170,60,'+a+')');g.addColorStop(.5,'rgba(255,90,20,'+a*.5+')');g.addColorStop(1,'rgba(255,60,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(c.x,c.y,R*2.1,0,Math.PI*2);ctx.fill();}
    // 殘影：這座城燒焦（顏色變暗、發橘光的輪廓）再慢慢消失
    {ctx.beginPath();f.pts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.closePath();
     const char=Math.min(1,u*2.2),alpha=u<.45?1:Math.max(0,1-(u-.45)/.4);
     ctx.globalAlpha=alpha;ctx.fillStyle=f.col;ctx.fill();
     ctx.fillStyle='rgba(40,16,6,'+(.78*char)+')';ctx.fill();
     ctx.shadowColor='rgba(255,120,30,.95)';ctx.shadowBlur=reduce?6:16;ctx.lineWidth=3;ctx.strokeStyle='rgba(255,170,70,'+(.9*(1-char*.4))+')';ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1;}
    // 火舌：沿著輪廓上半部密密地長出來（很多根細的，高低交錯、像波浪一樣一波一波），每根是會扭動的 S 形，外焰紅橘、中焰橘黃、焰心白黃
    {const env=Math.sin(Math.PI*Math.min(1,u*1.05)),top=f.pts.filter(q=>q.y<c.y+f.R*.35);
     if(top.length>1&&env>.02){
       const NT=reduce?14:34;
       for(let i=0;i<NT;i++){
         const t01=i/(NT-1),pos=t01*(top.length-1),k=Math.floor(pos),fr=pos-k,a0=top[k],a1=top[Math.min(top.length-1,k+1)];
         const bx=a0.x+(a1.x-a0.x)*fr+(((i*37)%7)-3)*R*.025,by=a0.y+(a1.y-a0.y)*fr+R*.08,ph=f.seed+i*2.3;
         const wave=reduce?.8:.55+.45*Math.sin(now*.007+i*.55)*Math.sin(now*.0031+i*.21+f.seed);   // 一波一波的高低
         const flick=reduce?1:.7+.3*Math.sin(now*(.013+((i*13)%5)*.002)+ph);
         const h=R*(.7+((i*53)%9)*.14)*wave*flick*env,w=R*(.13+((i*29)%4)*.03);
         if(h<5)continue;
         flameShape(bx,by,w,h,reduce?0:now,ph,1,'rgba(200,36,16,.92)','rgba(255,110,30,.9)');   // 外焰
         flameShape(bx,by,w*.68,h*.78,reduce?0:now,ph+.4,1,'rgba(255,140,30,.95)','rgba(255,200,60,.92)');   // 中焰
         flameShape(bx,by,w*.38,h*.5,reduce?0:now,ph+.9,1,'rgba(255,230,120,.95)','rgba(255,252,220,.9)');   // 焰心
       }
     }}
    // 火星：往上飄、左右晃、慢慢熄滅
    if(!reduce)for(let i=0;i<12;i++){
      const t=((u*1.3+i*.083+f.seed)%1),x=c.x+((((i*53)%11)/5.5)-1)*R*.9+Math.sin(t*9+i)*R*.18,y=c.y-R*.2-t*R*2.4,a=(1-t)*Math.min(1,u*5)*(u>.8?(1-u)/.2:1);
      ctx.fillStyle='rgba(255,'+(170+((i*29)%70))+',60,'+a+')';ctx.beginPath();ctx.arc(x,y,1.4+((i*7)%3)*.8,0,Math.PI*2);ctx.fill();
    }
    // 濃煙：後半段才出現，灰色的團往上冒、變淡
    if(u>.3&&!reduce)for(let i=0;i<4;i++){
      const t=Math.min(1,(u-.3)/.7+i*.05),x=c.x+((i-1.5)*R*.45)+Math.sin(u*5+i)*R*.12,y=c.y-R*.5-t*R*1.9,r=R*(.5+t*.5),a=.3*(1-t);
      const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(60,52,48,'+a+')');g.addColorStop(1,'rgba(60,52,48,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}

      ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(200,-14);ctx.lineTo(200,14);ctx.closePath();ctx.fill();}

// 成就解鎖：橫幅 + 彩紙 + 閃光 + 相關的城發出金光
function achievementBurst(list,T){
  const now=performance.now();
  list.forEach(a=>{
    const t0=Math.max(now,bannerFree);   // 橫幅一張接一張，不同時出現、不疊在一起
    const story=(a.story||'')+(a.ro?'（含《三國演義》情節）':'');
    const dur=Math.min(list.length>=3?3000:3600,Math.max(2200,1700+story.length*50));   // 劇情字數越多停留越久，讀得完
    bannerFree=t0+dur+120;
    fx.banners.push({t0,dur,name:a.name,story,sub:(a.y?a.y+' 年':'')+(a._first?(a.y?'・':'')+'首次達成':''),y:BOX_TOP-8});
    addConfetti(W/2,BOX_TOP-8,t0+120,34,[GOLD,GOLD2,'#fff6bf','#ffffff','#e0603f','#4f7cc4','#4f9a5e'],1.5,true);
    fx.flashes.push({t0:t0+100,dur:700,color:'255,226,130',alpha:.35});
    const gn=(a.id==='tri'||a.id==='all')?T.pcs.map(P=>P.s.n):(a.need||[]),gid0=gameId;
    setTimeout(()=>{if(gid0!==gameId)return;for(const n of gn){const st=STATES.find(x=>x.n===n),P=st&&pieceOf.get(st);if(P&&P.dropped)P.glow={t0:performance.now()+100,dur:1700};}},Math.max(0,t0-now));   // 輪到這張橫幅時才讓相關的城發光（用最新的城物件，不會被後面的排程覆蓋）
    const gid=gameId;setTimeout(()=>{if(gid===gameId&&!over&&roundState!=='won')SND.play('achievement');},Math.max(0,t0-now)+160);   // 剛通關時不疊成就的聲音
  });
  shakeScreen(now,3.5,450);
}

function drawFx(){
  const now=performance.now();
  drawFxBack(now);
  fx.stars=fx.stars.filter(q=>now-q.t0<STAR_MS);
  for(const q of fx.stars){
    const age=now-q.t0;if(age<0)continue;const u=age/STAR_MS;
    ctx.globalAlpha=1-u;drawStar(q.x+q.vx*age/1000,q.y+q.vy*age/1000,q.s*(1-.3*u));
  }
  ctx.globalAlpha=1;
  fx.pops=fx.pops.filter(p=>now-p.t0<POPUP_MS);
  for(const p of fx.pops){
    const t=(now-p.t0)/POPUP_MS;if(t<0)continue;

const toastQ=[];let toastBusy=false,toastGen=0;
function toast(title,sub){toastQ.push([title,sub,toastGen]);if(!toastBusy)nextToast();}   // 同時解鎖多個時依序顯示，不會互相蓋掉
function nextToast(){
  let it=toastQ.shift();
  while(it&&it[2]!==toastGen)it=toastQ.shift();      // 丟掉上一局留下的提示
  if(!it){toastBusy=false;return;}
  toastBusy=true;const gen=it[2];
  const el=document.getElementById('toast');
  {const r=cv.getBoundingClientRect();el.style.top=Math.round(r.top+r.height*.34)+'px';}   // 提示放在箱子上半部的空地，不遮住標題列的數據
  el.innerHTML=`<small>成就解鎖</small><b>${it[0]}</b>${it[1]}`;
  el.classList.add('show');
  setTimeout(()=>{if(gen!==toastGen)return;el.classList.remove('show');setTimeout(()=>{if(gen===toastGen)nextToast();},420);},2800);   // 舊局的計時器不能動到新局的提示
}
function resetToasts(){toastGen++;toastQ.length=0;toastBusy=false;const el=document.getElementById('toast');if(el)el.classList.remove('show');}
function checkAchievements(T){
  const names=new Set(T.pcs.map(p=>p.s.n)),facs=new Set(T.pcs.map(p=>p.s.f));
  const fresh=[];
  for(const a of ACH_DEF){
    if(achDone.has(a.id)||a.special)continue;
    const have=a.id==='tri'?facs.size:a.need.filter(n=>names.has(n)).length,tot=a.id==='tri'?3:a.need.length;
    if(tot&&have>(achProg.get(a.id)||0))achProg.set(a.id,have);
    const ok=a.id==='tri'?facs.size===3:a.need.every(n=>names.has(n));
    if(!ok)continue;
    achDone.add(a.id);a._first=!achEver.has(a.id);achEver.add(a.id);fresh.push(a);   // 本局解鎖；第一次達成會標示「首次達成」
    score+=ACH_BONUS;
  }
  if(fresh.length){
    saveAch();hud();
    // 一次解鎖很多個（例如整張地圖連成一片）時不要連續跳幾十張：只依序顯示最新的三個（每張都帶劇情），其餘合併成最後一張
    const show=fresh.length>3?fresh.slice(-3).reverse():fresh;
    const list=fresh.length>3?show.concat([{name:`另外還解鎖了 ${fresh.length-3} 個成就`,story:'到圖鑑裡看看吧',need:[]}]):show;
    achievementBurst(list,T);
  }
  renderAch();
}
function grantSpecial(ids){   // 困難通關：依戰場與星級解鎖困難限定成就
  const T=tops.reduce((m,t)=>!m||t.pcs.length>m.pcs.length?t:m,null),fresh=[];
  const add=id=>{const a=ACH_DEF.find(x=>x.id===id);if(!a||achDone.has(id))return;achDone.add(id);a._first=!achEver.has(id);achEver.add(id);fresh.push(a);score+=ACH_BONUS;};
  ids.forEach(add);
  if(['h:shu','h:wu','h:zhong'].every(i=>achEver.has(i)))add('h:all3');
  if(!fresh.length)return;
  saveAch();hud();achievementBurst(fresh,T||{pcs:[]});renderAch();
}

const mmCache=new Map();
function miniMap(a,lit){   // 成就要連的城，畫成小地圖（未解鎖時是灰色剪影）
  const sts=(a.id==='tri'?TRI_SHOW:(a.map||a.need)).map(n=>STATES.find(s=>s.n===n)).filter(Boolean);
  if(!sts.length)return '';
  const key=a.id+(lit?'1':'0');
  if(mmCache.has(key))return mmCache.get(key);
  const budget=420,tot=sts.reduce((m,s)=>m+s.v.length,0),step=Math.max(1,Math.ceil(tot/budget));
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const polys=sts.map(s=>{const pts=s.v.filter((_,i)=>i%step===0).map(([lo,la])=>[(lo-98)*40,(43.5-la)*48]);pts.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);});return {s,pts};});
  const pad=Math.max(x1-x0,y1-y0)*.04+1;
  const svg=`<svg viewBox="${(x0-pad).toFixed(1)} ${(y0-pad).toFixed(1)} ${(x1-x0+2*pad).toFixed(1)} ${(y1-y0+2*pad).toFixed(1)}" aria-hidden="true">`+polys.map(({s,pts})=>`<polygon points="${pts.map(([x,y])=>x.toFixed(1)+','+y.toFixed(1)).join(' ')}" fill="${lit?zcol(s):'currentColor'}" fill-opacity="${lit?1:.18}" style="stroke:var(--panel)" stroke-width="${((x1-x0)/120).toFixed(2)}" stroke-linejoin="round"/>`).join('')+'</svg>';
  const out=`<div class="mm">${svg}</div>`;mmCache.set(key,out);return out;
}

// 依原版做法：相鄰的州相連後，整組重建成「真實地理相對位置」的一張地圖，
// 大小依合併後的總面積重新計算（連得越多、整張越小），並沿用較大一塊的角度與合併重心。
const SHRINK_MS=250;
// 依真實地理把一批城（pcs：目前各自的物件）重新焊成新的一塊：算比例尺（取組內最小的 sc，也就是最大那座城決定，小城配合它；整州連齊才再縮小）、
// 重建每座城、焊成複合體、沿用最晚的落下時間。rebuildGroup（合併）與 rebuildSubset（火燒拆開）共用；
// 兩者只在「新的一塊放在哪裡」不同：合併取各塊質量加權的平均位置，拆開則讓一座參考城的世界座標不變。
function weldPieces(pcs){
  const states=pcs.map(p=>p.s);
  const before=new Map(pcs.map(p=>[p.s,{w:pieceWorld(p),k:p.k}]));   // 供縮小動畫：每州原本的姿態與大小
  const k=states.reduce((m,x)=>Math.min(m,x.sc),1e9)*Math.max(MIN_SHRINK,Math.pow(REGION_SHRINK,regionsDone(states)));   // 組內最大的城決定比例尺（小城配合它）；整個州連齊才再縮小
  const bs=states.map(s=>{const raw=s.p.map(q=>proj(q,k)),c=Vertices.centre(raw);return makePiece(s,c.x,c.y,k);});

  T.pcs.forEach(p=>{p.dropped=true;p.t0=t0;p.dropStep=ds;pieceOf.set(p.s,p);});
  return {T,before};
}
function rebuildGroup(olds){
  const pcs=olds.flatMap(o=>o.pcs);
  const mt=olds.reduce((s,o)=>s+o.mass,0);
  const wavg=f=>olds.reduce((s,o)=>s+f(o)*o.mass,0)/mt;
  const pos={x:wavg(o=>o.position.x),y:wavg(o=>o.position.y)};
  const vel={x:wavg(o=>o.velocity.x),y:wavg(o=>o.velocity.y)};
  const av=wavg(o=>o.angularVelocity);
  const big=olds.reduce((m,o)=>o.mass>m.mass?o:m);
  const ang=Math.atan2(Math.sin(big.angle),Math.cos(big.angle));
  const {T,before}=weldPieces(pcs);
  T.graceUntil=Math.max(0,...olds.map(o=>o.graceUntil||0));   // 新組沿用舊各塊的搖動免死期與越線累計（合併不能靠重建來重設）
  T.overSteps=Math.max(0,...olds.map(o=>o.overSteps||0));

  const bottom=o=>{let m=-1e9;o.parts.forEach((p,i)=>{if(o.parts.length>1&&i===0)return;for(const v of p.vertices)if(v.y>m)m=v.y;});return m;};

  if(!placeFree(T,others)){pcs.forEach(p=>pieceOf.set(p.s,p));return null;}

  return T;
}
function extents(o){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  o.parts.forEach((p,i)=>{if(o.parts.length>1&&i===0)return;for(const v of p.vertices){if(v.x<x0)x0=v.x;if(v.x>x1)x1=v.x;if(v.y<y0)y0=v.y;if(v.y>y1)y1=v.y;}});
  return {x0,x1,y0,y1};
}
// 逐一比對凸零件（Matter.Query.collides 對複合物體用的是外殼，凹陷處會誤判成重疊）；允許 1.5px 的接觸誤差
function overlapsAny(T,others){
  const parts=o=>o.parts.length>1?o.parts.slice(1):[o];
  const pa=parts(T);
  for(const o of others){
    if(!Matter.Bounds.overlaps(T.bounds,o.bounds))continue;
    for(const b of parts(o))for(const a of pa){
      if(a.bounds.max.x<b.bounds.min.x||a.bounds.min.x>b.bounds.max.x||a.bounds.max.y<b.bounds.min.y||a.bounds.min.y>b.bounds.max.y)continue;
      const c=Matter.Collision.collides(a,b);
      if(c&&c.depth>1.5)return true;
    }
  }

function placeFree(T,others){

    for(const dx of [0,-8,8,-16,16,-28,28]){

      if(e.x0<BOXL||e.x1>BOXR||e.y1>BOXB)continue;
      if(!overlapsAny(T,others))return true;
    }

// 依原版做法：焊接後相連的那一組若比箱寬的 MAX_FRAC 還寬（沿目前角度量測），整塊等比縮小到剛好 MAX_FRAC
let MAX_FRAC=0.9;
function shrinkToFit(T){
  const e=extents(T),w=e.x1-e.x0,h=e.y1-e.y0,lim=(BOXR-BOXL)*MAX_FRAC;
  let R=0;T.parts.forEach((p,i)=>{if(T.parts.length>1&&i===0)return;for(const v of p.vertices)R=Math.max(R,Math.hypot(v.x-T.position.x,v.y-T.position.y));});
  // 寬、高都不可超過箱寬的 90%；並確保旋轉成任何角度都放得進箱子（外接圓直徑不超過箱寬）

function scaleTop(T,k){

// 根因修正：Matter 0.19 會沿用既有接觸配對的碰撞物件，其中 parentA/parentB 只在建立時設定。
// 焊接後子零件改屬新的複合物體，但配對仍指向已被移除的舊物體 → 地板/鄰塊的推力作用在幽靈物體上，新物體因此一路陷下去。
function refreshPairs(){
  for(const pr of engine.pairs.list){
    const c=pr.collision;if(!c)continue;
    c.parentA=c.bodyA.parent;c.parentB=c.bodyB.parent;

const proj=([lo,la],k)=>({x:(lo-98)*40*k,y:(43.5-la)*48*k});
// 大小壓縮：邊長 ∝ 面積^0.32（而不是 ^0.5），讓小州不會太小、益州不會太大
const area=pts=>Math.abs(pts.reduce((a,[x,y],i)=>{const [x2,y2]=pts[(i+1)%pts.length];return a+x*y2-x2*y;},0))/2;
const AREAS=STATES.map(s=>area(s.p.map(q=>{const r=proj(q,1);return [r.x,r.y];}))).sort((a,b)=>a-b);
// 剛落下的單州畫得大（SINGLE_BASE）；相連成功後整組依總面積重算，縮到 BASE（連得越多越小）
const AREF=AREAS[AREAS.length>>1],GAMMA=0.32;
let SINGLE_BASE=0.45,BASE=0.3165;   // 校準（77 座城、箱寬 500、最後 60 秒倒數、整個州連齊才縮小）。歷程 0.34→0.42→0.43→0.46→0.45，皆依遊玩回饋「太容易」調整。自動玩家（依地理位置落點）量測：0.34 全連 3／8、0.42 0／10、0.44 0／10、0.46 0／10（多數在放城階段溢出）；0.46＋縮小下限 0.75＋倒數補洞磁吸 0～1／14。0.45 是折衷，還沒用自動玩家量過；真人比自動玩家強，待實際遊玩再調。BASE 已不再使用
STATES.forEach(s=>{s.a1=area(s.p.map(q=>{const r=proj(q,1);return [r.x,r.y];}));s.sc=SINGLE_BASE*Math.pow(s.a1/AREF,GAMMA-0.5);});
let MIN_PART_AREA=10;   // Matter 預設值；調高會削掉細長尖角，繪圖輪廓就會超出碰撞形狀

function fixInertia(body){
  if(body.parts.length<2)return;
  let I=0;
  for(let i=1;i<body.parts.length;i++){
    const p=body.parts[i],dx=p.position.x-body.position.x,dy=p.position.y-body.position.y;
    I+=p.inertia/4+p.mass*(dx*dx+dy*dy);
  }
  Body.setInertia(body,I*4);
}
// 去掉連續重複／幾乎重合的頂點（poly-decomp 遇到重複點會整個失敗，fromVertices 回傳 undefined）
function dedupePts(pts,eps=0.6){
  const out=[];
  for(const p of pts){const q=out[out.length-1];if(!q||Math.hypot(p.x-q.x,p.y-q.y)>=eps)out.push(p);}
  while(out.length>1&&Math.hypot(out[0].x-out[out.length-1].x,out[0].y-out[out.length-1].y)<eps)out.pop();
  return out;
}
function makePiece(s,x,y,k){
  k=k??s.sc;
  const raw=dedupePts(s.p.map(q=>proj(q,k)));
  const opt={friction:.5,frictionStatic:.8,restitution:.05,frictionAir:.012,density:.0015};
  // 萬一分解仍失敗，退而求其次用凸包，確保每座城都做得出來
  const b=Bodies.fromVertices(x??0,y??0,[raw],opt,false,0.01,MIN_PART_AREA)||Bodies.fromVertices(x??0,y??0,[Vertices.hull(raw)],opt);   // flagInternal=false；並丟掉過薄的碎零件（薄片的 SAT 分離軸會偏向側向，造成陷入）
  const c=Vertices.centre(raw);
  const subs=b.parts.length>1?b.parts.slice(1):[b];
  fixInertia(b);
  const P={s,subs,k,top:b,dropped:false,t0:0,off:{x:0,y:0},da:0,
    rel:s.v.map(q=>{const r=proj(q,k);return {x:r.x-c.x,y:r.y-c.y};}),
    lab:(()=>{const r=proj(s.l,k);return {x:r.x-c.x,y:r.y-c.y};})(),labR:s.r*40*k};   // 標籤放在「離邊界最遠」的點，labR 是可用半徑（px）
  subs.forEach(p=>p.piece=P);b.pcs=[P];pieceOf.set(s,P);return b;
}

// 把一組城（comp）依真實地理重新焊成新的一塊，位置接在原本那組上（某座參考城的世界座標不變）
function rebuildSubset(old,comp,siblings){
  const {T,before}=weldPieces(comp);

  Body.setAngle(T,old.angle);Body.setPosition(T,old.position);
  shrinkToFit(T);   // 先縮放，再用參考城對齊（縮放會以質心為中心，放在對齊之後會把參考城又推動）
  const ref=T.pcs[0],w0=before.get(ref.s).w,w1=pieceWorld(ref);
  Body.translate(T,{x:w0.c.x-w1.c.x,y:w0.c.y-w1.c.y});
  // 底部不可低於原本那一整塊的最低點（否則會陷進地板或下方的城），必要時整組上提（同 rebuildGroup）
  const bottom=o=>{let m=-1e9;o.parts.forEach((p,i)=>{if(o.parts.length>1&&i===0)return;for(const v of p.vertices)if(v.y>m)m=v.y;});return m;};
  const dy=bottom(T)-bottom(old);if(dy>0)Body.translate(T,{x:0,y:-dy});

  const r={x:T.position.x-old.position.x,y:T.position.y-old.position.y},w=old.angularVelocity;

  const others=tops.filter(x=>x!==old).concat(siblings||[]);
  for(let tries=0;tries<4&&!placeFree(T,others);tries++){if(tries<3)scaleTop(T,0.94);}
  if(!isHigh(old)&&isHigh(T)){T.graceUntil=Math.max(T.graceUntil,simStep+FIRE.graceSteps);T.overSteps=0;}   // 重建把這塊上提到溢出線以上（原本不在線上）：給 2 秒落回去；原本就超線的不延長，不能靠火燒拖延

}

// 直接給速度（單靠施力對重物不夠），讓整盤真的被搖起來
const SHAKE_MS=1000,SHAKE_GRACE_STEPS=150;
const MAGNET_CROSS_CAP=1;   // 還沒連齊的州，最多吸幾個別的州
const HOLE_D=120,HOLE_D_MAX=260,SMALL_PIECES=5;   // 倒數階段的補洞磁吸：交界點距離上限（像素）與「小塊」的城數上限
let shakeAnimT=0;
let lastShakeStep=-1e9;
// 倒數階段的搖一搖輔助：不在最大那一片裡的城，找一座鄰居（優先在最大那一片裡）當目標，搖起來時朝目標的方向翻過去
function shakeAssist(){
  const big=tops.reduce((m,t)=>t.pcs.length>m.pcs.length?t:m,tops[0]);
  const out=new Map();
  for(const t of tops){
    if(t===big)continue;
    let best=null,bd=1e9;
    for(const P of t.pcs){
      for(const o of tops){
        if(o===t)continue;
        for(const Q of o.pcs){
          if(!isAdj(P.s,Q.s))continue;
          const d=Math.hypot(Q.top.position.x-t.position.x,Q.top.position.y-t.position.y)-(o===big?60:0);   // 大片優先
          if(d<bd){bd=d;best=Q.top.position;}
        }
      }
    }
    if(!best)continue;
    const dx=best.x-t.position.x;
    out.set(t,{vx:Math.max(-7,Math.min(7,dx*.035))+(Math.random()-.5)*2,vy:-(9+Math.random()*4)});
  }
  return out;
}
function shake(){
  if(over||overlayOpen()||!tops.length||simStep<shakeReadyStep||roundState==='won')return;
  shakeReadyStep=simStep+SHAKE_COOLDOWN_STEPS;shakeCount++;SND.play('shake');   // 冷卻 0.5 秒
  const btn=document.getElementById('shake');btn.disabled=true;btn.classList.remove('on');void btn.offsetWidth;btn.classList.add('on');clearTimeout(shakeAnimT);{const gid=gameId;shakeAnimT=setTimeout(()=>{if(gid===gameId)btn.classList.remove('on');},950);}   // 冷卻只有 0.5 秒：連搖時動畫要重新開始
  lastShakeStep=simStep;
  const assist=roundState==='final'?shakeAssist():null;   // 倒數階段：沒連上的單獨城，搖一搖時會朝它的鄰居翻過去（避免被大片擋住的死局）
  tops.forEach(t=>{
    const as=assist&&assist.get(t);
    Body.setVelocity(t,as?{x:as.vx,y:as.vy}:{x:(Math.random()-.5)*6,y:-(5+Math.random()*5)});
    Body.setAngularVelocity(t,(Math.random()-.5)*.06);
    // 每塊城各自的免死期：搖完 2.5 秒內不計溢出，讓碎片有時間落回箱內。
    // 但搖動當下已經卡在溢出線上方的城不更新（同原版），所以連續搖動救不了本來就卡在線上的城
    if(!isHigh(t))t.graceUntil=simStep+SHAKE_GRACE_STEPS;
  });
  hud();
}

function toX(e){const r=cv.getBoundingClientRect();return VX+(e.clientX-r.left)/r.width*VW;}
function toY(e){const r=cv.getBoundingClientRect();return VY+(e.clientY-r.top)/r.height*VH;}
let ptrDown=false,ptrId=null;     // 只認「按下去的那一根手指」，其他手指的放開不會誤丟城
// 觸控長按查城名：手指按住不動約 0.4 秒，會顯示手指下那座城的名字（含被略過的），並讓它發光；
// 這時放開不會落城（要重新按一次才是正常落城）。按住後手指移動，會跟著切換到手指下的城。電腦滑鼠仍是移上去顯示。
let peek=null,peekTimer=0,peekStart=null,lastItems=[];
const PEEK_MS=400,PEEK_MOVE_PX=10;
function pieceAt(pt){for(const p of lastItems)if(!p._cur&&p._wp&&inPoly(pt,p._wp))return p;return null;}
function endPeek(){clearTimeout(peekTimer);peek=null;peekStart=null;}
function startPeek(pt){
  const P=pieceAt(pt);if(!P)return;                       // 手指下沒有城：照常瞄準，不算查名
  peek={P,x:pt.x,y:pt.y};P.glow={t0:performance.now(),dur:900};
  try{if(navigator.vibrate)navigator.vibrate(12);}catch(_){}
}
cv.addEventListener('pointerdown',e=>{if(ptrDown&&e.pointerId!==ptrId&&e.pointerType!=='mouse'){ptrDown=false;ptrId=null;endPeek();return;}   // 第二根手指落下（多半是雙指縮放）：第一根的落城作廢
  if(overlayOpen()||ptrDown)return;if(e.pointerType==='mouse'&&e.button!==0)return;   // 滑鼠只認左鍵
  ptrDown=true;ptrId=e.pointerId;dropX=toX(e);moveCur();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(e.pointerType!=='mouse'){endPeek();peekStart={x:e.clientX,y:e.clientY};const pt={x:toX(e),y:toY(e)};peekTimer=setTimeout(()=>{if(ptrDown&&peekStart)startPeek(pt);},PEEK_MS);}});
cv.addEventListener('pointermove',e=>{if(overlayOpen()||(ptrDown&&e.pointerId!==ptrId))return;dropX=toX(e);moveCur();if(e.pointerType==='mouse')hoverPt={x:toX(e),y:toY(e)};
  if(e.pointerType!=='mouse'&&ptrDown){
    const pt={x:toX(e),y:toY(e)};
    if(peek){const P=pieceAt(pt);if(P&&P!==peek.P){peek.P=P;P.glow={t0:performance.now(),dur:900};}peek.x=pt.x;peek.y=pt.y;}   // 查名中：跟著手指切換
    else if(peekStart&&Math.hypot(e.clientX-peekStart.x,e.clientY-peekStart.y)>PEEK_MOVE_PX){clearTimeout(peekTimer);peekStart=null;}   // 手指移動了：是在瞄準，不是長按
  }});
cv.addEventListener('pointerleave',()=>{hoverPt=null;});
cv.addEventListener('pointerup',e=>{if(!ptrDown||e.pointerId!==ptrId)return;ptrDown=false;ptrId=null;if(peek){endPeek();return;}endPeek();if(overlayOpen())return;dropX=toX(e);moveCur();drop();});   // 放開時才落下

const GHOST_ALPHA=1;   // 預告（還沒放下）的城的不透明度。原本是 0.7，放下前後會有色差；現在 1＝完全一樣的顏色
function drawPiece(P,ghost,labelPass){
  let w=pieceWorld(P),sc=1;
  if(P.anim){
    const u=(performance.now()-P.anim.t0)/SHRINK_MS;
    if(u>=1)P.anim=null;
    else{
      const e=1-Math.pow(1-u,3),f=P.anim.w;                  // easeOutCubic
      let da=w.a-f.a;da=Math.atan2(Math.sin(da),Math.cos(da));   // 走最短的轉向
      w={c:{x:f.c.x+(w.c.x-f.c.x)*e,y:f.c.y+(w.c.y-f.c.y)*e},a:f.a+da*e};
      sc=P.anim.r+(1-P.anim.r)*e;
    }
  }
  const scA=sc;
  const ps=popScale(P.top,performance.now());
  if(ps!==1){const tp=P.top.position;w={c:{x:tp.x+(w.c.x-tp.x)*ps,y:tp.y+(w.c.y-tp.y)*ps},a:w.a};sc*=ps;}
  const T=v=>{const q=rot({x:v.x*sc,y:v.y*sc},w.a);return {x:w.c.x+q.x,y:w.c.y+q.y};};
  if(labelPass){
    // 只算標籤的固定位置、字級與形狀面積，是否畫出由 placeLabels 決定（不位移、不搜尋）
    // 字級不依單城面積變化；整組相連縮小時，同一組的字一起略為縮小（下限 12），否則縮小後的形狀會被字整個蓋住
    const fs=Math.round(Math.max(12,LABEL_FS*Math.sqrt(Math.min(1,P.k*scA/P.s.sc)))*2)/2;
    const wp=P.rel.map(T);                                   // 形狀的世界座標（也供滑鼠移上去時判斷在哪座城）
    let ar=0;                                                // 形狀面積（與旋轉角度無關），用來排序
    for(let i=0;i<P.rel.length;i++){const q=P.rel[i],r=P.rel[(i+1)%P.rel.length];ar+=q.x*r.y-r.x*q.y;}
    ar=Math.abs(ar)/2*sc*sc;
    const lw=labelW(P.s.n,fs)+4,lh=fs*1.2;
    const an=labAnchor(P);
    let L=T(an);

    return;
  }
  ctx.beginPath();P.rel.forEach((v,i)=>{const q=T(v);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});ctx.closePath();
  ctx.fillStyle=zcol(P.s);ctx.globalAlpha=ghost?GHOST_ALPHA:1;ctx.fill();ctx.globalAlpha=1;

  ctx.lineJoin='round';ctx.lineWidth=1.4;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.stroke();
  if(P.glow){   // 成就：相關的城發出金光
    const u=(performance.now()-P.glow.t0)/P.glow.dur;
    if(u>=1)P.glow=null;
    else if(u>=0){const a=Math.pow(Math.sin(Math.PI*u),.8)*.7;ctx.globalAlpha=a;ctx.fillStyle='#ffe28a';ctx.fill();ctx.globalAlpha=1;ctx.lineWidth=3.5;ctx.strokeStyle=`rgba(255,200,70,${a})`;ctx.stroke();}
  }
}
// 標籤位置限制：不可壓到箱壁或箱底（預覽區在箱口以上，只限制不超出畫面）
function lblPos(L){
  const inBox=L.y>BOX_TOP-4;
  const yy=Math.min(BOXB,L.y+L.hy),yt=Math.max(BOX_TOP,L.y-L.hy);   // 斜牆：上下緣各量一次，取比較窄的那一側
  const x=Math.max((inBox?Math.max(wl(yy),wl(yt)):0)+L.hx+3,Math.min((inBox?Math.min(wr(yy),wr(yt)):W)-L.hx-3,L.x));
  const y=inBox?Math.min(BOXB-L.hy-4,L.y):Math.max(VY+L.hy+2,L.y);   // 箱內不壓底；箱口以上（預覽區）不超出畫面上緣
  return {x,y};
}
let labelFrame=0;
// 標籤錨點：優先用形狀的重心（看起來最置中）；重心落在形狀外或離邊界太近（凹形、細長）時，才退回「離邊界最遠的點」
function labAnchor(P){
  const r=P.rel,n=r.length;let a=0,cx=0,cy=0;
  for(let i=0;i<n;i++){const q=r[i],u=r[(i+1)%n],cr=q.x*u.y-u.x*q.y;a+=cr;cx+=(q.x+u.x)*cr;cy+=(q.y+u.y)*cr;}
  if(Math.abs(a)<1e-6)return P.lab;
  const c={x:cx/(3*a),y:cy/(3*a)};

  if(ptrDown&&!overlayOpen()&&fx.banners.length){let any=false;fx.banners.forEach(b=>{if((b.frz||0)<5000){b.t0+=dt;b.frz=(b.frz||0)+dt;any=true;}});if(any)bannerFree+=dt;}   // 手指按著畫面（瞄準中）：橫幅的時間先停住讓人讀完；每張橫幅累計最多停 5 秒，反覆按放也不會一直擋著棋盤
  if(overlayOpen()){acc=0;fx.banners.forEach(b=>{b.t0+=dt;});bannerFree+=dt;}   // 面板開著時不累積補算時間，關閉後才不會一口氣補跑；成就橫幅的時鐘也一起暫停，不會在面板後面播完
  if(engine&&!over&&!overlayOpen()){
    if(performance.now()<hitstopUntil)acc=0;      // 相連瞬間的短暫停頓
    else{let n=0;while(acc>=1000/60&&n<4&&!over&&performance.now()>=hitstopUntil){step();acc-=1000/60;n++;}
    if(n===4)acc=0;}
  }
  // 畫面更新頻率：有快速動靜（城在掉、特效、剛操作過、倒數）才全速重畫，而且最多約 60 張／秒（120Hz 螢幕不必畫 120 張）；
  // 只剩慢慢漂移約 30 張／秒；完全靜止、沒人操作降到 10 張／秒；面板蓋著降到 4 張／秒。任何狀態改變（drawDirty）一律立刻補畫一張。
  const ov=overlayOpen();if(ov!==prevOv){prevOv=ov;drawDirty=true;}
  const fxAny=fx.stars.length||fx.pops.length||fx.rings.length||fx.glints.length||fx.confetti.length||fx.flashes.length||fx.banners.length||(fx.fires&&fx.fires.length)||fx.shake||peek;
  const hot=drawDirty||fxAny||(!ov&&(ts-lastInputTs<1500||slowSteps<SLOW_AFTER||roundState==='final'||(DIFF==='hard'&&(evt.phase!=='calm'||fogA>0||floodLevel()>0))));
  const gap=hot?12:ov?250:calmSteps>=CALM_AFTER?100:33;   // 全速（約 60 張）／慢慢漂移（約 30 張）／完全靜止（10 張）／面板蓋著（4 張）
  if(drawDirty||ts-lastDrawTs>=gap){draw();lastDrawTs=ts;drawDirty=false;}
  requestAnimationFrame(frame);
}
['pointerdown','pointermove','pointerup','keydown','touchstart','touchmove','wheel'].forEach(ev=>addEventListener(ev,()=>{lastInputTs=performance.now();drawDirty=true;},{passive:true,capture:true}));
addEventListener('resize',()=>{drawDirty=true;});document.addEventListener('visibilitychange',()=>{drawDirty=true;});
// iPhone 的雙擊／連點放大：touch-action 在部分內嵌瀏覽器（例如 Discord、LINE）擋不住，所以按鈕上的觸控在 touchstart 就取消瀏覽器的預設手勢。
// 取消後瀏覽器不會再補發 click，所以按鈕由 touchend 自己觸發。只處理「單指落在按鈕上」：其他地方（畫布、背景、可捲動區域）完全不干涉，雙指縮放照常可用。
{
  const scrollers='#achList,#ovP,#ov .story,#ov .rules,#side';
  const btnAt=t=>t.closest&&!t.closest(scrollers)&&t.closest('button');
  let tg=null;   // 目前接管的單指按鈕手勢：第二根手指、手指拖遠、觸控被取消，都作廢，不補發點擊
  document.addEventListener('touchstart',e=>{
    if(tg)tg.ok=false;   // 已經有一根手指在按鈕上又來第二根：多指操作（例如雙指縮放），不是點擊
    if(e.touches.length===1&&btnAt(e.target)){const t=e.touches[0];tg={b:btnAt(e.target),x:t.clientX,y:t.clientY,ok:true};if(e.cancelable)e.preventDefault();}
  },{passive:false});
  document.addEventListener('touchmove',e=>{
    if(!tg||!tg.ok)return;const t=e.touches[0];
    if(!t||e.touches.length>1||Math.hypot(t.clientX-tg.x,t.clientY-tg.y)>14)tg.ok=false;
  },{passive:true});
  document.addEventListener('touchcancel',()=>{tg=null;});
  document.addEventListener('touchend',e=>{
    if(!tg)return;
    if(e.touches.length)return;
    const g=tg;tg=null;const b=g.b,t=e.changedTouches[0];
    if(!g.ok||b.disabled||!t)return;
    const under=document.elementFromPoint(t.clientX,t.clientY);   // 手指還在同一顆按鈕上才算點擊
    if(under&&btnAt(under)===b){if(e.cancelable)e.preventDefault();b.click();}
  },{passive:false});
  // 按鈕以外的地方（含選難度的卡片：它們在可捲動區裡，上面的按鈕保護不處理）快速連點兩下，iOS 內嵌瀏覽器會把畫面放大：
  // 第二下的 touchend 取消掉就不會放大；單指、單擊、雙指縮放都不受影響，畫布不處理（它本來就只允許雙指縮放）
  let lastTap=0,lastX=-999,lastY=-999;
  document.addEventListener('touchend',e=>{
    if(e.touches.length||e.changedTouches.length!==1)return;
    if(btnAt(e.target)||(e.target.closest&&e.target.closest('canvas')))return;
    const t=e.changedTouches[0],near=Math.hypot(t.clientX-lastX,t.clientY-lastY)<40;   // 雙擊放大要點在差不多同一處；點不同的卡片不受影響
    if(near&&e.timeStamp-lastTap<350&&e.cancelable)e.preventDefault();
    lastTap=e.timeStamp;lastX=t.clientX;lastY=t.clientY;
  },{passive:false});
}
function introHTML(){
  const hard=DIFF==='hard';
  return '<div class="sub">天下大勢，分久必合，合久必分</div>'+'<div class="story">漢室傾頹，群雄並起。<br>洛陽、許昌、成都、建業……<br>烽火連年，山河破碎，有人據城而守，有人火燒赤壁。<br>這一回，你不必披甲上陣，<br>只需讓每座名城各歸其位。</div><div class="rules"><div class="rt">玩　法</div><div>◆ 點一下放下城池；電腦可用 ← → 移動、空白鍵放下。</div><div>◆ 相鄰的城相接，就會拼回真實地圖；整個州連成一片，還會縮小、騰出空間。</div><div>◆ 連出官渡、赤壁等名場面，可解鎖歷史成就。</div><div>◆ 最後一座城落下後有 60 秒，全部連成一片才算天下一統。</div><div>◆ 城池堆過紅線太久，國土便會崩裂；搖一搖可以讓城池鬆開。</div>'+(hard?'<div>◆ 困難：局勢多變，見機行事。</div>':'')+'</div>';
}
function diffHTML(){
  const bs=readStars();
  const card=(id,t,sub)=>'<button type="button" class="dcard'+(DIFF===id?' on':'')+'" data-d="'+id+'" role="radio" aria-checked="'+(DIFF===id)+'"><b>'+t+'</b><span>'+sub+'</span></button>';
  return '<div class="difflabel">選　擇　難　度</div><div class="dcards" role="radiogroup" aria-label="難度">'
    +card('normal','普通','原始玩法，經典的拼圖體驗')
    +card('hard','困難（Beta測試版）','局勢多變，未知的挑戰'+(bs?'・最佳 '+'★'.repeat(bs)+'☆'.repeat(3-bs):''))
    +'</div>'
    +(DIFF==='hard'&&DEVMODE?'<div class="fieldrow" role="radiogroup" aria-label="戰場"><span>戰　場</span>'+[['random','隨機'],...FIELDS.map(f=>[f.id,f.name])].map(f=>'<button type="button" class="fchip'+(FIELD_PICK===f[0]?' on':'')+'" data-f="'+f[0]+'" role="radio" aria-checked="'+(FIELD_PICK===f[0])+'">'+f[1]+'</button>').join('')+'</div>':'');
}
function toggleRules(){const ov=document.getElementById('ov'),r=document.getElementById('ovR');const on=ov.classList.toggle('showrules');r.textContent=on?'返回簡介':'玩法說明';}   // 簡介：玩法說明 ⇄ 返回簡介
function showIntro(){show('山河輿圖',introHTML(),'開始遊戲',()=>{showDiffPick();},true);document.body.classList.add('intro');}   // 第一步：故事＋開始遊戲／玩法說明
function showDiffPick(){   // 第二步：選難度，按「出戰」才真正開始；「返回」回到第一步
  show('山河輿圖',diffHTML(),'出戰',()=>{document.body.classList.remove('intro');},true);
  const rb=document.getElementById('ovR');rb.textContent='返回';rb.onclick=()=>showIntro();
  document.body.classList.add('intro');
}
function openDiffPick(){init();showDiffPick();}   // 結算框的「換難度」：先清掉上一局，直接到第二步選難度
document.getElementById('ovP').addEventListener('click',e=>{const fc=e.target.closest&&e.target.closest('.fchip');if(fc){FIELD_PICK=fc.dataset.f;try{localStorage.setItem('sg_field',FIELD_PICK);}catch(e2){}init();showDiffPick();return;}   // 指定戰場：重畫這一步並重開一局
  const b=e.target.closest&&e.target.closest('.dcard');if(!b)return;DIFF=b.dataset.d==='hard'?'hard':'normal';try{localStorage.setItem('sg_diff',DIFF);}catch(e2){}init();showDiffPick();});   // 選難度：整局重來並重畫這一步
{try{DIFF=localStorage.getItem('sg_diff')==='hard'?'hard':'normal';const f=localStorage.getItem('sg_field');if(DEVMODE&&FIELDS.some(x=>x.id===f))FIELD_PICK=f;}catch(e){}}   // 指定戰場只在 ?dev=1 有效：一般玩家沒有選項可以取消，不能被舊的測試設定卡住
{const u=new URLSearchParams(location.search).get('field');if(FIELDS.some(x=>x.id===u))FIELD_PICK=u;}   // 網址指定戰場（測試用）
resize();init();showIntro();
requestAnimationFrame(frame);
